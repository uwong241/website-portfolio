  <text x="400" y="230" font-family="sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle">Ahmad Daffa Arief</text>
  <line x1="280" y1="250" x2="520" y2="250" stroke="#38bdf8" stroke-width="2" />

  <!-- Course Title -->
  <text x="400" y="290" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">FOR SUCCESSFULLY COMPLETING THE COURSE</text>
  <text x="400" y="335" font-family="sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle">Belajar Dasar Cloud dan Gen AI di AWS</text>

  <!-- Details Footer -->
  <text x="100" y="460" font-family="monospace" font-size="12" fill="#94a3b8">ISSUED: 27 Oktober 2026</text>
  <text x="100" y="480" font-family="monospace" font-size="11" fill="#64748b">ID: ERZR7YERNZYV</text>

  <!-- Verified Badge -->
  <g transform="translate(640, 430)">
    <circle cx="30" cy="30" r="26" fill="#0284c7" opacity="0.2" />
    <circle cx="30" cy="30" r="20" fill="#0369a1" />
    <path d="M22 30 L27 35 L38 23" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="62" font-family="sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">VERIFIED</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d121d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)" rx="16" />
  
  <!-- Fancy Certificate Outer Border -->
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="url(#borderGrad)" stroke-width="3" rx="12" opacity="0.8" />
  <rect x="28" y="28" width="744" height="504" fill="none" stroke="#1e293b" stroke-width="1.5" rx="8" />

  <!-- Corner Ornaments -->
  <circle cx="40" cy="40" r="8" fill="#38bdf8" opacity="0.5" />
  <circle cx="760" cy="40" r="8" fill="#38bdf8" opacity="0.5" />
  <circle cx="40" cy="520" r="8" fill="#38bdf8" opacity="0.5" />
  <circle cx="760" cy="520" r="8" fill="#38bdf8" opacity="0.5" />

  <!-- Header Branding -->
  <text x="400" y="85" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">CERTIFICATE OF COMPLETION</text>
  <line x1="250" y1="100" x2="550" y2="100" stroke="#334155" stroke-width="1" />

